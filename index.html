<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>软工2602 · 班级助手</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f2f4f7;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e6e9ef;
  --primary:#2563eb;--present:#10b981;--personal:#f59e0b;--sick:#8b5cf6;--absent:#ef4444;--unmarked:#94a3b8;
  --tabh:60px;--radius:16px;color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b0e14;--card:#161b24;--text:#e9eef6;--muted:#8b93a3;--line:#232a36;--unmarked:#6b7280}
}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"HarmonyOS Sans SC","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);-webkit-overflow-scrolling:touch}
main.has-savebar{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 96px)}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
input{font-family:inherit}
.hidden{display:none}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line)}
#tabs button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
#tabs button.on{color:var(--primary)}
#tabs .ic{font-size:19px;line-height:1}

.primary{background:var(--primary);color:#fff;border:0;border-radius:14px;font-size:17px;font-weight:600;padding:15px;width:100%;box-shadow:0 4px 14px rgba(37,99,235,.25)}
.primary:active{transform:scale(.99)}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:14px;font-size:16px;padding:14px;width:100%}
.mini{border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:14px;padding:7px 10px;color:var(--muted);font-weight:700}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:13px 14px;font-size:16px;outline:none}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.6}

.shead{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.rh{display:flex;align-items:center;gap:10px}
.rh .date{font-size:13px;color:var(--muted);white-space:nowrap}
.title-in{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:21px;font-weight:700;padding:2px 0;outline:none;font-family:inherit;border-bottom:1px dashed transparent}
.title-in:focus{border-bottom-color:var(--line)}
.pbar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 8px}
.pbar i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .18s ease}
.rh-sub{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.rh-sub b{color:var(--text);font-size:13px}
.cnt{display:inline-flex;align-items:center;gap:4px}
.d{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--unmarked)}
.d.present{background:var(--present)}.d.personal{background:var(--personal)}.d.sick{background:var(--sick)}.d.absent{background:var(--absent)}

.card{background:var(--card);border-radius:var(--radius);margin:12px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:62px;border-bottom:1px solid var(--line);position:relative;transition:background .12s}
.row:last-child{border-bottom:0}
.row[data-st="present"]{box-shadow:inset 3px 0 0 var(--present)}
.row[data-st="personal"]{box-shadow:inset 3px 0 0 var(--personal)}
.row[data-st="sick"]{box-shadow:inset 3px 0 0 var(--sick)}
.row[data-st="absent"]{box-shadow:inset 3px 0 0 var(--absent)}
.row:active{background:rgba(100,116,139,.08)}
.idx{width:24px;text-align:center;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.who{flex:1;min-width:0}
.nm{font-size:17.5px;font-weight:650;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px;letter-spacing:.3px}
.acts{display:flex;gap:6px;align-items:center;flex:none}
.pill{font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(148,163,184,.16);color:var(--muted);white-space:nowrap;border:0}
.pill.st-present{background:rgba(16,185,129,.14);color:var(--present)}
.pill.st-personal{background:rgba(245,158,11,.16);color:#b45309}
.pill.st-sick{background:rgba(139,92,246,.14);color:#7c3aed}
.pill.st-absent{background:rgba(239,68,68,.14);color:var(--absent)}

.savebar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:30;padding:10px 14px 12px;background:linear-gradient(to top,var(--bg) 55%,transparent)}

.hero{padding:46px 22px 20px;text-align:center}
.hero h1{font-size:27px;margin:0 0 8px;letter-spacing:1px}
.hero .sub{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:20px 0 18px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:11px 16px;border-radius:999px;font-size:15px}
.chip:active{background:var(--line)}
.hero .lbl{font-size:14px;color:var(--muted);margin-top:26px}

#sheet{position:fixed;inset:0;z-index:60}
#sheet .mask{position:absolute;inset:0;background:rgba(2,6,23,.5);opacity:0;transition:opacity .2s}
#sheet .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s cubic-bezier(.22,1,.36,1);max-height:88vh;overflow:auto}
#sheet.on .mask{opacity:1}
#sheet.on .sheet{transform:translateY(0)}
.sheet-h{font-size:19px;font-weight:700;margin:2px 4px 14px}
.sheet-p{font-size:14.5px;color:var(--muted);margin:0 4px 20px;line-height:1.65}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.opt{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:16px;font-weight:600}
.opt.on{border-color:var(--primary);background:rgba(37,99,235,.08)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

#toast{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);z-index:55;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px;pointer-events:none}
#toast.hidden{display:none}
#toast.above-save{bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 100px)}
.toast-row{pointer-events:auto;background:#0f172a;color:#fff;padding:11px 15px;border-radius:13px;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:100%}
.toast-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:64vw}
.toast-row button{background:none;border:0;color:#7dd3fc;font-size:14px;font-weight:700;padding:0;flex:none}

.mcard{background:var(--card);border-radius:var(--radius);margin:12px;padding:15px 16px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.mcard:active{background:var(--line)}
.mc-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mc-name{font-size:17px;font-weight:650}
.mc-due{font-size:12px;color:var(--muted);white-space:nowrap}
.mc-sub{display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
.mc-sub b{color:var(--text)}
.mrow{display:flex;align-items:center;gap:8px;padding:9px 12px;min-height:60px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow[data-mst="done"]{box-shadow:inset 3px 0 0 var(--present)}
.mrow[data-mst="exempt"]{box-shadow:inset 3px 0 0 var(--primary)}
.note-line{font-size:12px;color:var(--personal);margin-top:3px;line-height:1.45;white-space:normal;word-break:break-all}
mark{background:rgba(245,158,11,.35);color:inherit;border-radius:3px;padding:0 1px}
.filterbar{display:flex;gap:7px;flex-wrap:wrap;padding:10px 0 2px}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;max-width:66vw;overflow:hidden;text-overflow:ellipsis}
.fchip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.kchip{color:var(--personal);border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.08)}
.kchip.on{background:var(--personal);border-color:var(--personal);color:#fff}
.fchip.copy{color:var(--primary);border-style:dashed}
.empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px}
.macts{display:flex;gap:6px;align-items:center;flex:none}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:11px 13px;font-size:15px;outline:none;margin-top:10px}
.searchwrap{position:relative;margin-top:10px}
.searchwrap .search{margin-top:0;padding-right:42px}
.sclr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(148,163,184,.18);color:var(--muted);font-size:15px;line-height:1;display:none;align-items:center;justify-content:center}
.sclr.on{display:flex}
.note-inline{font-size:11.5px;color:var(--muted);margin-left:8px;font-weight:400}
.back{border:0;background:none;color:var(--text);font-size:26px;line-height:1;padding:0 6px 0 0}
.mtitle{flex:1;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.result{padding:22px 16px 10px}
.res-h{font-size:22px;font-weight:700;margin:0 0 4px}
.res-d{font-size:13.5px;color:var(--muted)}
.bignums{display:flex;gap:12px;margin:18px 0}
.bignum{flex:1;background:var(--card);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.bignum .v{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums}
.bignum .k{font-size:12.5px;color:var(--muted);margin-top:4px}
.grp{background:var(--card);border-radius:var(--radius);margin:12px;padding:14px 16px}
.grp .g-h{font-size:13px;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.grp .g-n{font-size:15.5px;line-height:1.7}
.sect{display:flex;align-items:center;justify-content:space-between;margin:22px 18px 2px;font-size:13px;color:var(--muted)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow:active{background:rgba(100,116,139,.07)}
.hmore{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.hmore:active{background:var(--line)}
.logrow{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;line-height:1.5}
.logrow:last-child{border-bottom:0}
.logrow .lt{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.logrow .le{color:var(--primary);flex:none;font-weight:700}
.logrow .lm{color:var(--text);word-break:break-all}
.hstats{font-size:12px;color:var(--muted);text-align:right;line-height:1.5;white-space:nowrap}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line);font-size:16px}
.setrow:last-child{border-bottom:0}
.setrow .v{color:var(--muted);font-size:14px}

/* 打印 */
#printArea{display:none}
@media print{
  html,body{display:block!important;height:auto!important;overflow:visible!important;background:#fff!important}
  #main,#tabs,#sheet,#toast,.savebar{display:none!important}
  #printArea{display:block!important}
  @page{size:A4;margin:12mm}
  #printArea{font-family:"SimSun","Songti SC",serif;color:#000}
  .p-title{font-size:20pt;font-weight:700;text-align:center;margin:0 0 6px;letter-spacing:2px}
  .p-sub{font-size:10.5pt;text-align:center;margin:0 0 12px;color:#333}
  .p-table{width:100%;border-collapse:collapse;font-size:10.5pt}
  .p-table th,.p-table td{border:1px solid #000;padding:4px 6px;text-align:center;height:22px}
  .p-table th{font-weight:700;background:#f2f2f2}
  .p-foot{display:flex;justify-content:space-between;font-size:10.5pt;margin-top:14px;padding:0 4px}
  .p-sum{font-size:10.5pt;margin:10px 4px 0}
}
</style>
</head>
<body>
<main id="main"></main>
<nav id="tabs"></nav>
<div id="sheet" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="printArea"></div>
<script>
/* ============ 名单 ============ */
var ROSTER = [
 [1,'26401070201','周屹天','男'],[2,'26401070202','郭鑫','男'],[3,'26401070203','朱子涵','男'],
 [4,'26401070204','宋宇豪','男'],[5,'26401070205','张志豪','男'],[6,'26401070206','牟旭洋','男'],
 [7,'26401070207','张家豪','男'],[8,'26401070208','熊园园','男'],[9,'26401070209','赵家烁','男'],
 [10,'26401070211','黄天润','男'],[11,'26401070212','容苡钧','男'],[12,'26401070213','翁昊','男'],
 [13,'26401070214','陈栋彦','男'],[14,'26401070216','周卢坚','男'],[15,'26401070217','杨炼','男'],
 [16,'26401070218','刘宇轩','男'],[17,'26401070219','陈弘旭','男'],[18,'26401070220','李佩航','男'],
 [19,'26401070221','褚金豪','男'],[20,'26401070222','潘金平','男'],[21,'26401070223','晏文博','男'],
 [22,'26401070224','叶天宇','男'],[23,'26401070225','谢申能','男'],[24,'26401070226','严义晗','男'],
 [25,'26401070227','张弛','男'],[26,'26401070228','李澳辉','男'],[27,'26401070229','黄奥周','男'],
 [28,'26401070231','陈鑫钰','女'],[29,'26401070232','杨释如','女'],[30,'26401070233','庄筱语','女'],
 [31,'26401070234','刘谨泞','女'],[32,'26401070235','付悦悦','女'],[33,'26401070236','张雅雯','女'],
 [34,'26401070237','朱雅思','女']
];
var STK={present:'在岗',personal:'事假',sick:'病假',absent:'缺席'};
var MSTK={done:'已交',not:'未交',exempt:'免交'};
var KEY='sw2602.v2', OLDLABEL='刘宇轩';
var APPVER='v0.6';
var main=document.getElementById('main');
var tabsEl=document.getElementById('tabs');
var sheetEl=document.getElementById('sheet');
var toastEl=document.getElementById('toast');

/* ============ 状态 ============ */
function blank(){
  return {owner:OLDLABEL,lastBackup:0,pcAddr:'',lastPush:0,students:ROSTER.map(function(r){return {no:r[0],id:r[1],name:r[2],sex:r[3]}}),sessions:[],materials:[],draft:null};
}
var S;
try{ var raw=localStorage.getItem(KEY)||localStorage.getItem('sw2602.v1'); S=raw?JSON.parse(raw):blank(); }catch(e){ S=blank(); }
if(!S.students||!S.students.length) S.students=blank().students;
if(!S.owner) S.owner=OLDLABEL;
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('本地保存失败：'+e.message); } }

var view='roll', openMat=null, viewSession=null;
var matQ='', matFilter='all', matKw='';
var toastTimer=null;

/* ============ 工具 ============ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function pad2(n){ return String(n).padStart(2,'0'); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtDate(s){ var p=String(s||today()).split('-'); var dt=new Date(+p[0],+p[1]-1,+p[2]); return (+p[1])+'月'+(+p[2])+'日 周'+'日一二三四五六'[dt.getDay()]; }
function fmtNow(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function fmtDay(ts){ var d=new Date(ts); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function counts(rec){ var c={present:0,personal:0,sick:0,absent:0,unmarked:0}; S.students.forEach(function(s){ var r=rec[s.id]; if(!r)c.unmarked++; else c[r.st]++; }); return c; }
function byId(id){ for(var i=0;i<S.students.length;i++) if(S.students[i].id===id) return S.students[i]; return null; }
/* 浮窗：最多 3 条，带撤销的 3 分钟后自动消失；同一个人重复操作只更新那一条 */
var TOAST_UNDO_MS=180000, TOAST_MS=3200, toasts=[];
function toast(msg,undo,key){
  key=key||('auto:'+uid());
  var t=null;
  for(var i=0;i<toasts.length;i++) if(toasts[i].key===key) t=toasts[i];
  if(!t){
    t={key:key};
    toasts.push(t);
    while(toasts.length>3){ var gone=toasts.shift(); clearTimeout(gone.timer); }
  }
  t.msg=msg; t.undo=undo||null;
  clearTimeout(t.timer);
  t.timer=setTimeout(function(){ dropToast(key); }, undo?TOAST_UNDO_MS:TOAST_MS);
  paintToasts();
}
function dropToast(key){
  toasts=toasts.filter(function(x){return x.key!==key});
  paintToasts();
}
function paintToasts(){
  if(!toasts.length){ toastEl.classList.add('hidden'); toastEl.innerHTML=''; return; }
  toastEl.classList.remove('hidden');
  toastEl.classList.toggle('above-save', view==='roll' && !!S.draft);
  toastEl.innerHTML=toasts.map(function(t){
    return '<div class="toast-row"><span>'+esc(t.msg)+'</span>'+
      (t.undo?'<button data-toastundo="'+esc(t.key)+'">撤销</button>':'')+'</div>';
  }).join('');
}
function clearToasts(prefix){
  toasts=prefix?toasts.filter(function(t){return t.key.indexOf(prefix)!==0}):[];
  paintToasts();
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast('已复制，去微信粘贴即可')},function(){fallbackCopy(t)});
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制，去微信粘贴即可'); }catch(e){ toast('复制失败，请长按文本手动复制'); }
  ta.remove();
}

/* ============ 使用日志 ============ */
var LOGKEY='sw2602.log.v1';
function readLog(){
  try{ return JSON.parse(localStorage.getItem(LOGKEY)||'[]'); }catch(e){ return []; }
}
function log(ev,msg){
  try{
    var arr=readLog();
    arr.push({t:new Date().toISOString().slice(0,19).replace('T',' '),ev:ev||'info',msg:String(msg==null?'':msg).slice(0,400)});
    if(arr.length>800) arr=arr.slice(-800);
    localStorage.setItem(LOGKEY,JSON.stringify(arr));
  }catch(e){}
}
function logText(){
  var d=new Date();
  var head=['软工2602 班级助手 · 使用日志',
    '生成时间：'+d.toLocaleString('zh-CN'),
    '版本：'+(APPVER||'?')+'　来源：'+(location.protocol==='file:'?'本地文件':'在线 '+location.host),
    '点名记录：'+(S.sessions||[]).length+' 次　材料：'+(S.materials||[]).length+' 项　学生：'+(S.students||[]).length+' 人',

    '<div style="padding:12px 14px 4px"><button class="ghost" data-newmat>＋ 新建材料</button></div>';
}
function curMat(){ return S.materials.filter(function(x){return x.id===openMat})[0]; }
function notesCount(m){
  var n=0; S.students.forEach(function(s){ if(m.marks[s.id]&&m.marks[s.id].note) n++; }); return n;
}
function matVisible(m){
  var q=matQ.trim().toLowerCase(), f=matFilter;
  return S.students.filter(function(s){
    var r=m.marks[s.id], st=r?r.st:'not';
    if(f==='note'){ if(!(r&&r.note)) return false; }
    else if(f!=='all' && f!==st) return false;
    if(matKw && !(r&&r.note&&r.note.indexOf(matKw)>=0)) return false;
    if(!q) return true;
    if(s.name.toLowerCase().indexOf(q)>=0) return true;
    if(s.id.indexOf(q)>=0) return true;
    if(r&&r.note&&r.note.toLowerCase().indexOf(q)>=0) return true;
    return false;
  });
}
function noteChips(m){
  var notes={}, order=[];
  S.students.forEach(function(s){
    var r=m.marks[s.id]; if(!r||!r.note) return;
    var t=r.note.trim(); if(!t) return;
    if(notes[t]===undefined){ notes[t]=0; order.push(t); }
    notes[t]++;
  });
  var chips=[], seen={};
  NOTE_TAGS.forEach(function(tag){
    var n=0;
    order.forEach(function(t){ if(t.indexOf(tag)>=0) n+=notes[t]; });
    if(n>=2){ seen[tag]=1; chips.push([tag,n]); }
  });
  order.forEach(function(t){ if(notes[t]>=2 && !seen[t]){ seen[t]=1; chips.push([t,notes[t]]); } });
  chips.sort(function(a,b){ return b[1]-a[1]; });
  return chips.map(function(c){
    return '<button class="fchip kchip'+(matKw===c[0]?' on':'')+'" data-mkw="'+esc(c[0])+'">'+esc(c[0])+' '+c[1]+'</button>';
  }).join('');
}
function hl(text,q){
  text=String(text==null?'':text);
  if(!q) return esc(text);
  var lower=text.toLowerCase(), out='', i=0;
  while(i<text.length){
    var idx=lower.indexOf(q,i);
    if(idx<0){ out+=esc(text.slice(i)); break; }
    out+=esc(text.slice(i,idx))+'<mark>'+esc(text.slice(idx,idx+q.length))+'</mark>';
    i=idx+q.length;
  }
  return out;
}
function matRowsHTML(m){
  var q=matQ.trim().toLowerCase(), list=matVisible(m);
  if(!list.length) return '<div class="card"><div class="empty">没有符合条件的人<br><span style="font-size:12.5px;opacity:.75">试试点「全部」或清空搜索框</span></div></div>';
  var rows=list.map(function(s){
    var r=m.marks[s.id], mst=r?r.st:'not';
    return '<div class="mrow" data-sid="'+s.id+'" data-mst="'+mst+'">'+

function mset(sid,st,note){
  var m=S.materials.filter(function(x){return x.id===openMat})[0]; if(!m) return;

/* ============ 导出：极简 xlsx ============ */
var CRC=(function(){var t=new Int32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c}return t})();
function crc32(u8){var c=0^-1;for(var i=0;i<u8.length;i++)c=(c>>>8)^CRC[(c^u8[i])&0xff];return (c^-1)>>>0}
function enc(str){return new TextEncoder().encode(str)}
function zipStore(files){
  var parts=[],central=[],offset=0;
  files.forEach(function(f){
    var name=enc(f.name), data=f.data, crc=crc32(data);
    var lh=new Uint8Array(30+name.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0x0800,true);dv.setUint16(8,0,true);
    dv.setUint16(10,0,true);dv.setUint16(12,0,true);dv.setUint32(14,crc,true);dv.setUint32(18,data.length,true);
    dv.setUint32(22,data.length,true);dv.setUint16(26,name.length,true);dv.setUint16(28,0,true);lh.set(name,30);
    parts.push(lh,data);
    var cd=new Uint8Array(46+name.length), cv=new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);
    cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0,true);cv.setUint32(16,crc,true);
    cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);
    cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);
    cv.setUint32(38,0,true);cv.setUint32(42,offset,true);cd.set(name,46);
    central.push(cd); offset+=lh.length+data.length;
  });
  var cdSize=central.reduce(function(a,b){return a+b.length},0);
  var eocd=new Uint8Array(22), ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);ev.setUint16(8,files.length,true);
  ev.setUint16(10,files.length,true);ev.setUint32(12,cdSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
  var out=new Uint8Array(offset+cdSize+22), p=0;
  parts.forEach(function(b){out.set(b,p);p+=b.length});
  central.forEach(function(b){out.set(b,p);p+=b.length});
  out.set(eocd,p);
  return out;
}

function downloadBytes(u8,name,mime){
  var blob=new Blob([u8],{type:mime||'application/octet-stream'});
  var f=null;
  try{ f=new File([blob],name,{type:mime||'application/octet-stream'}); }catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f],title:name}).catch(function(){ fallbackDownload(blob,name); });
  } else fallbackDownload(blob,name);
}
function fallbackDownload(blob,name){
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},4000);
  toast('文件已生成，看看「下载」里');
}

  var done=0,ex=0;

  var rows=[], merges=['A1:F1','A2:F2'];
  rows.push({h:32,cells:[{v:'软工2602 '+m.name+'提交情况表',s:1}]});
  rows.push({h:20,cells:[{v:(subset?'筛选结果 '+list.length+' 人':'共 '+S.students.length+' 人')+'　已交 '+done+' 人　免交 '+ex+' 人　未交 '+(list.length-done-ex)+' 人'+(m.due?'　截止 '+m.due:''),s:0}]});
  rows.push({h:24,cells:[{v:'序号',s:2},{v:'学号',s:2},{v:'姓名',s:2},{v:'性别',s:2},{v:'状态',s:2},{v:'备注',s:2}]});
  list.forEach(function(s){
    var r=m.marks[s.id], k=r?r.st:'not';
    rows.push({cells:[{v:s.no,s:3},{v:s.id,s:3},{v:s.name,s:3},{v:s.sex,s:3},{v:MSTK[k],s:3},{v:(r&&r.note)?r.note:'',s:5}]});
  });
  rows.push({h:20,cells:[{v:'',s:0}]});
  rows.push({h:20,cells:[{v:footText(),s:4}]});
  merges.push('A'+(rows.length)+':F'+(rows.length));
  return {name:m.name,cols:[6,18,12,8,10,28],rows:rows,merges:merges,freeze:3};
}
/* 考勤总表 xlsx：行=学生，列=每次点名 */
function summarySheet(){
  var sess=S.sessions, marks={present:'√',personal:'事',sick:'病',absent:'缺'};
  var cols=[6,18,11].concat(sess.map(function(){return 9}),[8]);
  var merges=[], head=['序号','学号','姓名'].concat(sess.map(function(x){return x.date.slice(5)+' '+x.title}),['缺勤']); 
  var rows=[{h:30,cells:[{v:'软工2602 考勤汇总表',s:1}]}];
  var ncol=cols.length;
  merges.push('A1:'+colName(ncol)+'1');
  rows.push({h:20,cells:[{v:'统计范围：'+(sess.length?sess[0].date+' 至 '+sess[sess.length-1].date:'无')+'　共 '+sess.length+' 次',s:0}]});
  merges.push('A2:'+colName(ncol)+'2');
  rows.push({h:26,cells:head.map(function(h){return {v:h,s:2}})});
  S.students.forEach(function(st){
    var miss=0;
    var cells=[{v:st.no,s:3},{v:st.id,s:3},{v:st.name,s:3}];
    sess.forEach(function(x){
      var r=x.rec[st.id];
      if(r&&(r.st==='absent')) miss++;
      cells.push({v:r?marks[r.st]:'',s:3});
    });
    cells.push({v:miss,s:3});
    rows.push({cells:cells});
  });
  rows.push({h:20,cells:[{v:'',s:0}]});
  rows.push({h:20,cells:[{v:footText(),s:4}]});
  merges.push('A'+(rows.length)+':'+colName(ncol)+(rows.length));
  return {name:'考勤汇总',cols:cols,rows:rows,merges:merges,freeze:3};
}

function importBackup(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(fr.result);
      if(!o.students||!o.students.length) throw new Error('文件内容不对');
      var ns=(o.sessions||[]).length, nm=(o.materials||[]).length;
      showSheet('<div class="sheet-h">导入备份</div>'+
        '<div class="sheet-p">这份备份里有 <b>'+ns+'</b> 次点名、<b>'+nm+'</b> 项材料。<br>'+
          '「合并」会把备份里的记录加进来，<b>手机现在的记录一条都不会少</b>；<br>'+
          '「替换」才会清掉现在全部数据。</div>'+
        '<button class="primary" id="imMerge">合并导入（推荐）</button>'+
        '<button class="ghost" style="margin-top:10px" id="imReplace">替换现有数据</button>'+
        '<button class="ghost" style="margin-top:10px" data-close>取消</button>',
        function(box){
          box.querySelector('#imMerge').onclick=function(){ closeSheet(); doImport(o,'merge'); };
          box.querySelector('#imReplace').onclick=function(){ closeSheet(); doImport(o,'replace'); };
          box.querySelector('[data-close]').onclick=closeSheet;
        });
    }catch(e){ toast('导入失败：'+e.message); log('error','导入失败：'+e.message); }
  };
  fr.readAsText(file);

function doImport(o,mode){
  try{
    // 导入前先存一份快照，可在「设置 → 撤销上次导入」里恢复
    try{ localStorage.setItem('sw2602.beforeImport',JSON.stringify({at:Date.now(),data:S})); }catch(e){}
    var added=0, kept=0, mats=0;
    if(mode==='replace'){
      S=o;
      if(!S.owner) S.owner=OLDLABEL;
      if(!S.students||!S.students.length) S.students=blank().students;
      added=(S.sessions||[]).length; mats=(S.materials||[]).length;
    } else {
      // 名单：并集
      var haveId={};
      S.students.forEach(function(s){ haveId[s.id]=1; });
      (o.students||[]).forEach(function(s){ if(!haveId[s.id]){ S.students.push(s); haveId[s.id]=1; } });
      // 点名：按 id 合并（导入的覆盖同 id）
      var map={};
      S.sessions.forEach(function(x){ if(x.id) map[x.id]=x; });
      (o.sessions||[]).forEach(function(x){
        if(!x.id) return;
        if(map[x.id]){ map[x.id]=x; kept++; } else { map[x.id]=x; added++; }
      });
      S.sessions=Object.keys(map).map(function(k){return map[k]})
        .sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
      // 材料：按 id 合并，marks 逐人合并（导入的覆盖）
      var mm={};
      S.materials.forEach(function(x){ if(x.id) mm[x.id]=x; });
      (o.materials||[]).forEach(function(x){
        if(!x.id) return;
        if(mm[x.id]){
          var m=mm[x.id];
          m.marks=Object.assign({},m.marks||{},x.marks||{});
          if(x.name) m.name=x.name;
          if(x.due!==undefined) m.due=x.due;
        } else { mm[x.id]=x; mats++; }
      });
      S.materials=Object.keys(mm).map(function(k){return mm[k]});
      if(!S.owner) S.owner=o.owner||OLDLABEL;
    }
    save(); view='roll'; openMat=null; render(); main.scrollTop=0;
    log('导入',mode==='merge'?('合并：新增 '+added+' 次点名，材料共 '+S.materials.length+' 项'):('替换：'+added+' 次点名'));
    toast(mode==='merge'?('合并完成：新增 '+added+' 次点名，原来的都在'):'已替换为备份数据');
  }catch(e){ toast('导入失败：'+e.message); log('error','导入异常：'+e.message); }
}
function undoImport(){
  var raw=null; try{ raw=localStorage.getItem('sw2602.beforeImport'); }catch(e){}
  if(!raw){ toast('没有可撤销的导入'); return; }
  var b=JSON.parse(raw);
  sheetConfirm('撤销上次导入？','把数据恢复到导入前的样子（'+new Date(b.at).toLocaleString('zh-CN')+' 那份）。','恢复',function(){
    S=b.data; save(); view='roll'; render(); main.scrollTop=0; toast('已恢复到导入前'); log('导入','撤销上次导入');
  });
}
function addStudent(){
  var n=document.getElementById('newName').value.trim();
  var id=document.getElementById('newId').value.trim();
  if(!n){ toast('写个名字'); return; }
  if(!id){ id='2640107'+String(900+S.students.length); }
  var no=S.students.length?Math.max.apply(null,S.students.map(function(s){return s.no}))+1:S.students.length+1;
  S.students.push({no:no,id:id,name:n,sex:'男'});
  save(); render(); toast('已添加 '+n);
}

/* 事件委托 */
document.addEventListener('click',function(e){
  var el=e.target;

  var ub=el.closest('[data-toastundo]');
  if(ub){
    var k=ub.dataset.toastundo, t=null;
    for(var i=0;i<toasts.length;i++) if(toasts[i].key===k) t=toasts[i];
    if(t&&t.undo){ var fn=t.undo; dropToast(k); fn(); } else dropToast(k);
    return;
  }

  var tb=el.closest('[data-tab]');
  if(tb){ view=tb.dataset.tab; openMat=null; render(); main.scrollTop=0; return; }

  var st=el.closest('[data-start]');
  if(st){ startRoll(st.dataset.start); return; }

  if(el.closest('#saveRoll')){ askSave(); return; }

  var act=el.closest('[data-act]');
  if(act){
    var a=act.dataset.act, sid=act.dataset.sid;
    if(a==='date'){ sheetDate(); return; }
    if(a==='absent'){ setStatus(sid,'absent'); return; }
    if(a==='personal'){ sheetStatus(sid); return; }
    return;
  }
  var row=el.closest('.row[data-sid]');
  if(row && view==='roll'){
    if(row.dataset.st==='unmarked') setStatus(row.dataset.sid,'present');
    else sheetStatus(row.dataset.sid);
    return;
  }
  var sv=el.closest('[data-sv]');
  if(sv){ closeSheet(); finishSave(); return; }
  var back=el.closest('[data-back]');
  if(back){ if(view==='matdetail'){view='mat';openMat=null;matQ='';matFilter='all';matKw='';clearToasts('mat:');} else if(view==='students'||view==='logs'){view='settings';} render(); return; }
  var newmat=el.closest('[data-newmat]');
  if(newmat){ sheetNewMat(); return; }
  var mat=el.closest('[data-mat]');
  if(mat){
    if(lpFired){ lpFired=false; return; }
    openMat=mat.dataset.mat; matQ=''; matFilter='all'; matKw=''; view='matdetail'; render(); main.scrollTop=0; return;
  }
  if(el.closest('#mClear')){
    matQ=''; matFilter='all'; matKw='';
    var inp=document.getElementById('mSearch'); if(inp) inp.value='';
    renderMatList(); return;
  }
  var mf=el.closest('[data-mf]');
  if(mf){ matFilter=mf.dataset.mf; matKw=''; renderMatList(); return; }
  var mk=el.closest('[data-mkw]');
  if(mk){
    var kw=mk.dataset.mkw;
    if(matKw===kw){ matKw=''; } else { matKw=kw; matFilter='all'; }
    renderMatList(); return;
  }
  if(el.closest('[data-mfcopy]')){ copyFiltered(); return; }
  var mact=el.closest('[data-mact]');
  if(mact){
    var sid3=mact.dataset.sid;
    var m=S.materials.filter(function(x){return x.id===openMat})[0]; if(!m) return;
    var cur=m.marks[sid3]?m.marks[sid3].st:'not';
    if(mact.dataset.mact==='toggle') mset(sid3, cur==='done'?'not':'done');
    else if(mact.dataset.mact==='exempt') mset(sid3, cur==='exempt'?'not':'exempt');
    else if(mact.dataset.mact==='note') sheetNote(sid3);
    return;
  }
  if(el.closest('[data-copyleft]')){ copyLeft(); return; }
  if(el.closest('[data-expmat]')){ exportMaterial(S.materials.filter(function(x){return x.id===openMat})[0]); return; }
  if(el.closest('[data-expsum]')){ exportSummary(); return; }
  if(el.closest('#copyRes')){ copyText(resultText(viewSession)); return; }
  if(el.closest('#expRes')){ exportSession(viewSession); return; }
  if(el.closest('#doneRes')){ view='roll'; viewSession=null; render(); main.scrollTop=0; return; }
  if(el.closest('#expLog')){ exportLog(); return; }
  if(el.closest('#clearLog')){
    sheetConfirm('清空使用日志？','只清日志，点名和材料数据不受影响。','清空',function(){
      try{ localStorage.removeItem(LOGKEY); }catch(e){}
      log('日志','清空日志'); view='logs'; render(); toast('日志已清空');
    });
    return;
  }
  var hmore=el.closest('[data-hmore]');
  if(hmore){ sheetSessionActions(hmore.dataset.hmore); return; }
  var sess=el.closest('[data-sess]');
  if(sess){
    if(lpFired){ lpFired=false; return; }
    viewSession=S.sessions.filter(function(x){return x.id===sess.dataset.sess})[0];
    view='result'; render(); main.scrollTop=0; return;
  }
  var set=el.closest('[data-set]');
  if(set){
    var k=set.dataset.set;
    if(k==='baks') exportBackup();
    else if(k==='impt') document.getElementById('impFile').click();
    else if(k==='undoimp') undoImport();
    else if(k==='logs'){ view='logs'; render(); main.scrollTop=0; }
    else if(k==='clear') sheetConfirm('清空所有数据？','点名记录、材料记录会全部删除，建议先导出备份。','确认清空',function(){ S=blank(); save(); log('清空','清空所有数据'); view='roll'; render(); toast('已清空'); });
    else if(k==='stu'){ view='students'; render(); main.scrollTop=0; }
    else if(k==='owner') sheetOwner();
    else if(k==='pcaddr') sheetPcAddr();
    else if(k==='push') pcPush();
    else if(k==='pull') pcPull();
    return;
  }
  var del=el.closest('[data-delstu]');
  if(del){
    var id2=del.dataset.delstu; var s2=byId(id2);
    sheetConfirm('删除「'+esc(s2.name)+'」？','从名单里移除这个人（历史记录不受影响）。','确认删除',function(){
      S.students=S.students.filter(function(x){return x.id!==id2}); save(); render();
    });
    return;
  }
  if(el.closest('#addStu')){ addStudent(); return; }
  if(el.closest('[data-close]')){ closeSheet(); return; }
});
/* 长按：记录行 / 材料里的同学 / 材料卡片 */
var lpTimer=null, lpFired=false;
document.addEventListener('touchstart',function(e){
  var hrow=e.target.closest('.hrow');
  var mrow=e.target.closest('.mrow');
  var mcard=e.target.closest('[data-mat]');
  if(!hrow&&!mrow&&!mcard) return;
  lpFired=false;
  clearTimeout(lpTimer);
  lpTimer=setTimeout(function(){
    lpFired=true;
    if(hrow) sheetSessionActions(hrow.dataset.sess);
    else if(mrow) sheetMatStudent(mrow.dataset.sid);
    else if(mcard) sheetMatActions(mcard.dataset.mat);
  },520);
},{passive:true});
document.addEventListener('touchmove',function(){ clearTimeout(lpTimer); },{passive:true});
document.addEventListener('touchend',function(){ clearTimeout(lpTimer); },{passive:true});
document.addEventListener('contextmenu',function(e){ if(e.target.closest('.hrow,.mrow,[data-mat]')) e.preventDefault(); });

document.addEventListener('input',function(e){
  if(e.target.id==='sTitle'&&S.draft){ S.draft.title=e.target.value||'点名'; save(); return; }
  if(e.target.id==='mSearch'){ setMatQuery(e.target.value); }
});
document.addEventListener('change',function(e){
  if(e.target.id==='impFile'&&e.target.files&&e.target.files[0]) importBackup(e.target.files[0]);
});
['compositionend','search'].forEach(function(evt){
  document.addEventListener(evt,function(e){
    if(e.target&&e.target.id==='mSearch'){ setMatQuery(e.target.value); }
  });
});
